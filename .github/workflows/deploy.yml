# Deploys to Vercel on every push to main. The repo can't use Vercel's Git integration
# (it lives under semere-wazza, the Vercel account is linked to SemereT627), so CI runs the CLI instead.
# Needs one repo secret: VERCEL_TOKEN (vercel.com/account/tokens).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Not secret: they only identify the project; VERCEL_TOKEN grants access.
  VERCEL_ORG_ID: team_2ibv1DYxH9Fv3Fm5E6BEnHmW
  VERCEL_PROJECT_ID: prj_agtCmrib5ajlFMxg8ZRdQPxVSGcE

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: |
          pnpm lint
          pnpm test

      # Vercel builds remotely with the project's production env vars, same as `vercel deploy --prod` locally.
      - name: Deploy
        run: pnpm dlx vercel@65.9.0 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
